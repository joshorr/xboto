[project]
name = "xboto"
version = "1.3.0"
description = "Easy lazy dependency injection for boto3 clients/resources."
authors = [{ name = "Josh Orr", email = "josh@orr.blue" }]
requires-python = ">=3.14,<4"
readme = "README.md"
keywords = [
    "boto",
    "boto client",
    "boto resource",
    "inject",
    "lazy",
    "dependency",
    "dependency injection",
    "aws",
]
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: The Unlicense (Unlicense)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "xinject>=1.11.0,<2",
    "boto3>=1.26.64,<2",
    "botocore>=1.29.64,<2",
    "xsentinels>=1.2.1,<2",
]

[project.urls]
Repository = "https://github.com/joshorr/xboto"

[dependency-groups]
dev = [
    "ipdb>=0.13.9,<0.14",
    "pdoc3>=0,<1",
    "pytest>=9,<10",
    "pytest-mock>=3.6.1,<4",
    "pytest-pycodestyle>=2.3.0,<3",
    "black",
    "moto[dynamodb2, ssm]>=5,<6",
    "pyright>=1.1.272,<2",
    "py>=1.11.0,<2",
    "boto3-stubs[essential]>=1.25.3,<2",
    "mkdocstrings[python]>=1,<2",
    "mkdocs>=1.4.1,<2",
    "mkdocs-material>=9,<10",
    "mkdocs-autorefs>=1,<2",
    "mike>=2.1.3,<3",
    "mkdocs-git-revision-date-plugin>=0.3.2,<0.4",
    "tomlkit>=0.14.0,<0.15",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["xboto"]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.custom.xpublish]
extra-module-docs = ['xsentinels', 'xinject']

[tool.pyright]
include = "xboto"

[tool.black]
line-length = 99
target_version = ['py38']
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  | foo.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''

[tool.isort]
profile = "black"
